version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: shipstream_postgres

    restart: always

    environment:
      POSTGRES_DB: shipstream
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: shipstream_redis

    restart: always

    ports:
      - "6379:6379"

  django:
    build: .

    container_name: shipstream_backend

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - redis
  
  celery:                    
    build: .

    container_name: shipstream_celery

    command: celery -A config worker --loglevel=info

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - postgres
      - redis


volumes:

  postgres_data: