

services:

  postgres:
    image: postgres:16
    container_name: shipstream_postgres

    restart: always

    environment:
      POSTGRES_DB: shipstream
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shipstream"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

    container_name: shipstream_redis

    restart: always

    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build: .

    container_name: shipstream_backend

    command: sh -c "python manage.py migrate && python manage.py seed_demo_data && python manage.py runserver 0.0.0.0:8000"

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DB_HOST: postgres

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  
  celery:
    build: .

    container_name: shipstream_celery

    command: celery -A config worker --loglevel=info

    volumes:
      - .:/app

    env_file:
      - .env

    environment:
      DB_HOST: postgres

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .

    container_name: shipstream_celery_beat

    command: celery -A config beat --loglevel=info

    volumes:
      - .:/app

    env_file:
      - .env

    environment:
      DB_HOST: postgres

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data: