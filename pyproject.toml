[tool.ruff]
line-length=100
target-version='py313'
exclude=[
    'migrations',
    '.venv',
    'venv',
]

[tool.ruff.lint]
select=[
    'E',
    'F',
    'W',
    'I',
]
ignore=[
    'E501',
]

[tool.ruff.format]
quote-style='single'
indent-style='space'
line-ending='auto'

[tool.coverage.run]
source=['.']
omit=[
    '*/migrations/*',
    'venv/*',
    '.venv/*',
    'manage.py',
    'config/wsgi.py',
    'config/asgi.py',
    'config/settings/dev.py',
    'config/settings/prod.py',
    '*/tests.py',
    'conftest.py',
]

[tool.coverage.report]
exclude_lines=[
    'pragma: no cover',
    'raise NotImplementedError',
]